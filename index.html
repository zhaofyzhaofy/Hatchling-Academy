<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小蛋壳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bfe3ff">
<title>小蛋壳学堂</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
  --pink:#ff8fab; --yellow:#ffc94d; --green:#5fd39a; --blue:#7fb4ff; --purple:#b892ff;
  --ink:#3b3b52; --ink2:#7a7a94;
  --card:#ffffff; --shadow:0 8px 0 rgba(0,0,0,.10), 0 14px 30px rgba(60,80,140,.16);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  color:var(--ink);overflow:hidden;
  background:linear-gradient(180deg,#bfe3ff 0%,#e6f6ff 45%,#fff6e8 100%);
  user-select:none;
}
/* 背景装饰 */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sun{position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,#ffe999,#ffd54a 60%,rgba(255,213,74,0) 72%);opacity:.85}
.cloud{position:absolute;font-size:64px;opacity:.75;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hill{position:absolute;bottom:-60px;width:150%;height:220px;left:-25%;border-radius:50% 50% 0 0;
  background:#b6ecb0;opacity:.5}

/* 屏幕容器 */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  max-width:620px;margin:0 auto;padding:14px 16px 18px}
.screen{display:none;flex-direction:column;height:100%;animation:fadeUp .32s ease}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 首页顶部 */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex:0 0 auto}
.pet{font-size:40px;line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.hud .grow{flex:1}
.starbox{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;
  padding:7px 16px;box-shadow:0 4px 0 rgba(0,0,0,.08);font-weight:800;font-size:19px}
.starbox .s{font-size:20px}
.starbox.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}

.title{font-size:30px;font-weight:900;letter-spacing:1px;text-align:center;margin:2px 0 4px;
  color:#fff;text-shadow:0 3px 0 #63b8f0,0 6px 14px rgba(70,130,200,.45)}
.subtitle{text-align:center;color:var(--ink2);font-size:14px;font-weight:600;margin-bottom:14px}

/* 关卡卡片 */
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.gcard{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;
  animation:fadeUp .4s ease backwards}
.gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--accent)}
.gcard .ico{width:58px;height:58px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;
  font-size:31px;background:var(--soft)}
.gcard .info{flex:1;min-width:0}
.gcard .nm{font-size:20px;font-weight:900}
.gcard .meta{font-size:13px;color:var(--ink2);font-weight:600;margin-top:3px}
.gcard.disabled{opacity:.55}

/* 按钮 */
.btn{border:0;border-radius:16px;font-family:inherit;font-weight:800;cursor:pointer;
  padding:11px 18px;font-size:16px;color:#fff;background:var(--blue);
  box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
.btn.small{padding:9px 16px;font-size:15px;border-radius:14px}
.btn.pink{background:var(--pink)} .btn.green{background:var(--green)}
.btn.yellow{background:var(--yellow);color:#6b4b00} .btn.purple{background:var(--purple)}
.btn.ghost{background:#fff;color:var(--ink2);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.btn[disabled]{filter:grayscale(.5);opacity:.6;pointer-events:none}

/* 学习卡 */
.learnwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.lettercard{width:min(74vw,300px);height:min(74vw,300px);background:#fff;border-radius:44px;
  box-shadow:0 14px 0 rgba(0,0,0,.10),0 22px 44px rgba(60,80,140,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:6px solid var(--soft);cursor:pointer;transition:transform .12s;padding:12px}
.lettercard:active{transform:scale(.96)}
.lettercard .big{font-size:clamp(84px,26vw,132px);font-weight:900;line-height:1;
  color:var(--accent);text-shadow:0 5px 0 rgba(0,0,0,.08)}
.lettercard .py{font-size:22px;font-weight:800;color:#a3a3bb;letter-spacing:2px;margin-top:-4px}
.lettercard .py:empty{display:none}
.lettercard .word{font-size:19px;font-weight:800;color:var(--ink2)}
.lettercard .emo{font-size:36px}
#lcEmo.many{font-size:clamp(16px,4.8vw,23px);line-height:1.4;letter-spacing:1px;
  max-width:82%;text-align:center;word-break:break-all}
/* 拼读：配方在上、音节在下 */
.lettercard.formula .py{order:1;font-size:clamp(24px,7.5vw,34px);font-weight:900;
  color:var(--accent);letter-spacing:3px;margin-top:0}
.lettercard.formula .big{order:2;font-size:clamp(64px,20vw,104px)}
.lettercard.formula .emo{order:3}
.lettercard.formula .word{order:4}
.lettercard.flip{animation:flip .4s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.tip{font-size:15px;color:var(--ink2);font-weight:700;text-align:center;line-height:1.4}
.navrow{display:flex;gap:12px;align-items:center;justify-content:center;width:100%}

/* 闯关头部 */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:0 0 auto}
.progress{flex:1;height:16px;background:rgba(255,255,255,.85);border-radius:999px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.progress i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--yellow),var(--pink));transition:width .35s}
.combo{font-weight:900;color:#ff6a3d;font-size:16px;min-width:56px;text-align:right}
.combo.show{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;min-height:0}

/* 拼音：喇叭 */
.speaker{width:min(46vw,168px);height:min(46vw,168px);border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#ffe07a,#ffb03a);
  box-shadow:0 12px 0 #e08a1a,0 20px 40px rgba(220,140,30,.35);
  font-size:clamp(54px,17vw,84px);cursor:pointer;display:grid;place-items:center;
  transition:transform .08s,box-shadow .08s;position:relative}
.speaker:active{transform:translateY(8px);box-shadow:0 4px 0 #e08a1a}
.speaker.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:5px solid #ffb03a;animation:ring .7s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}

/* 题卡 */
.qcard{width:100%;max-width:430px;border:0;font-family:inherit;cursor:pointer;
  background:#fff;border-radius:30px;padding:22px 18px 16px;
  box-shadow:0 10px 0 rgba(0,0,0,.11),0 18px 34px rgba(60,80,140,.16);
  display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .1s}
.qcard:active{transform:scale(.97)}
.qcard.ring{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.qvisual{font-size:clamp(22px,6.4vw,36px);line-height:1.35;word-break:break-all;
  text-align:center;letter-spacing:1px}
.qvisual .op{color:#ff9f43;font-weight:900;margin:0 6px}
.qvisual .off{filter:grayscale(1);opacity:.28}
.qvisual .bigemo{display:block;font-size:clamp(56px,17vw,92px);line-height:1.15}
.qvisual .bigzi{display:block;font-size:clamp(76px,23vw,118px);font-weight:900;
  line-height:1.12;color:var(--ink)}
.qexpr{font-size:clamp(26px,8vw,42px);font-weight:900;color:var(--ink);letter-spacing:2px}
.qexpr .q{color:#ff6a3d}
.qexpr.fml{font-size:clamp(22px,7vw,38px);letter-spacing:1px}
.qpy{font-size:clamp(22px,6.5vw,34px);font-weight:800;color:#9d9db6;letter-spacing:3px}
.qaudio{font-size:13px;font-weight:800;color:var(--ink2);background:rgba(0,0,0,.05);
  padding:5px 14px;border-radius:999px}

/* 选项 */
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto;flex:0 0 auto}
.opt{aspect-ratio:1/1.08;border-radius:24px;border:0;background:#fff;cursor:pointer;
  font-family:inherit;font-size:clamp(38px,11vw,60px);font-weight:900;color:var(--ink);
  box-shadow:0 8px 0 rgba(0,0,0,.13);display:grid;place-items:center;
  transition:transform .08s,box-shadow .08s;position:relative;overflow:hidden}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.13)}
.opt.pic{font-size:clamp(46px,14vw,70px)}
.opt.syl{font-size:clamp(30px,9vw,48px)}
.opt.sm{font-size:clamp(34px,10vw,54px)}
.opt.tone{font-size:clamp(24px,8vw,42px);letter-spacing:0}
.opt.tone.long{font-size:clamp(18px,5.6vw,32px)}
.opt.right{background:linear-gradient(180deg,#8ff0b6,#4fd58e);color:#fff;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.opt.wrong{background:linear-gradient(180deg,#ffb4b4,#ff8181);color:#fff;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* 结算 */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.result .medal{font-size:96px;animation:bob 1.6s ease-in-out infinite}
.result .score{font-size:26px;font-weight:900}
.result .starrow{font-size:46px;letter-spacing:6px}
.result .starrow span{opacity:.22}
.result .starrow span.on{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.result .words{font-size:18px;font-weight:800;color:var(--ink2)}

/* 飘星 & 彩带 */
.fly{position:fixed;z-index:99;font-size:40px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}
 25%{transform:translate(-50%,-50%) scale(1.5);opacity:1}
 100%{transform:translate(-50%,-190%) scale(.7);opacity:0}}
.confetti{position:fixed;top:-40px;z-index:98;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* 时长显示 */
.timechip{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 13px;
  font-weight:800;font-size:14px;color:var(--ink2);box-shadow:0 4px 0 rgba(0,0,0,.07);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.timechip.warn{background:#ffe3e3;color:#e04b4b}

/* 休息 / 时长锁定 遮罩 */
.blocker{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:linear-gradient(180deg,rgba(24,34,66,.94),rgba(48,68,120,.96));color:#fff}
.blocker.show{display:flex;animation:fadeUp .3s ease}
.blocker .bemo{font-size:92px;line-height:1;animation:bob 2.6s ease-in-out infinite}
.blocker .btitle{font-size:27px;font-weight:900;letter-spacing:1px}
.blocker .bdesc{font-size:16px;font-weight:600;opacity:.88;line-height:1.6;max-width:340px}
.blocker .bcount{font-size:clamp(40px,13vw,58px);font-weight:900;letter-spacing:3px;
  background:#fff;color:#3b3b52;border-radius:22px;padding:8px 28px;
  font-variant-numeric:tabular-nums}
.blocker .btask{background:rgba(255,255,255,.14);border-radius:22px;padding:14px 22px 12px;
  max-width:370px;display:flex;flex-direction:column;align-items:center;gap:9px}
.blocker .btasklabel{font-size:13px;font-weight:800;opacity:.72;letter-spacing:1px}
.blocker .btaskbody{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;
  line-height:1.45;text-align:left}
.blocker .btaskemo{font-size:30px;line-height:1;flex:0 0 auto}
.blocker .btasknext{background:rgba(255,255,255,.22);border:0;color:#fff;font-family:inherit;
  font-weight:800;font-size:14px;padding:7px 18px;border-radius:999px;cursor:pointer}
.blocker .btasknext:active{transform:scale(.95)}
.blocker .bparent{margin-top:20px;font-size:13px;font-weight:700;opacity:.5;
  background:transparent;border:0;color:#fff;cursor:pointer;text-decoration:underline;
  font-family:inherit;padding:6px 10px}

/* 顶部工具条 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:0 0 auto}
.topbar .grow{flex:1;font-weight:800;font-size:17px;color:var(--ink2);text-align:center}

/* 首次进入：声音解锁层（手机浏览器要求先有一次真实点击才允许朗读） */
#audioGate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(30,44,74,.55);padding:24px}
#audioGate.show{display:flex}
#audioGate .gate{background:#fff;border-radius:30px;padding:32px 26px 24px;text-align:center;
  max-width:340px;width:100%;box-shadow:0 18px 44px rgba(20,40,80,.32);animation:fadeUp .3s ease}
#audioGate .gem{font-size:62px;line-height:1;animation:bob 1.6s ease-in-out infinite}
#audioGate .gt{font-size:23px;font-weight:900;margin:12px 0 8px}
#audioGate .gd{font-size:14px;color:var(--ink2);font-weight:600;line-height:1.65;margin-bottom:20px}
#audioGate .gb{width:100%;font-size:20px;padding:15px 0}

/* 声音异常时的一次性提示条 */
#audioTip{position:fixed;left:50%;bottom:16px;z-index:70;max-width:88vw;
  transform:translateX(-50%) translateY(180%);transition:transform .35s ease;
  background:rgba(40,44,66,.95);color:#fff;font-size:13.5px;font-weight:600;line-height:1.6;
  padding:12px 17px;border-radius:16px;box-shadow:0 10px 26px rgba(20,30,60,.35)}
#audioTip.show{transform:translateX(-50%) translateY(0)}
#audioTip b{color:#ffd76a}
</style>
</head>
<body>

<div class="bg">
  <div class="sun"></div>
  <div class="cloud" style="top:8%;animation-duration:46s">☁️</div>
  <div class="cloud" style="top:22%;animation-duration:64s;animation-delay:-18s;font-size:44px">☁️</div>
  <div class="cloud" style="top:38%;animation-duration:80s;animation-delay:-42s;font-size:34px">☁️</div>
  <div class="hill"></div>
</div>

<div id="app">

  <!-- ========== 首页 ========== -->
  <section id="scr-home" class="screen active">
    <div class="hud">
      <div class="pet" id="homePet">🥚</div>
      <div class="timechip" id="timeChip">⏳ 30 分</div>
      <div class="grow"></div>
      <div class="starbox" id="homeStars"><span class="s">⭐</span><b>0</b></div>
    </div>
    <div class="title">小蛋壳学堂</div>
    <div class="subtitle" id="homeTip">点一点，听声音，收星星！</div>
    <div class="list" id="groupList"></div>
  </section>

  <!-- ========== 学一学 ========== -->
  <section id="scr-learn" class="screen">
    <div class="topbar">
      <button class="btn small ghost" onclick="go('home')">← 返回</button>
      <div class="grow" id="learnTitle"></div>
      <button class="btn small ghost" onclick="startQuiz(state.groupId)">去闯关 →</button>
    </div>
    <div class="learnwrap">
      <div class="lettercard" id="letterCard">
        <div class="big" id="lcBig">b</div>
        <div class="py" id="lcPy"></div>
        <div class="emo" id="lcEmo">👨</div>
        <div class="word" id="lcWord">爸爸</div>
      </div>
      <div class="tip">👆 点卡片再听一次</div>
      <div class="navrow">
        <button class="btn ghost" onclick="learnStep(-1)">上一个</button>
        <div class="tip" id="lcCount" style="min-width:70px"></div>
        <button class="btn green" onclick="learnStep(1)">下一个</button>
      </div>
    </div>
  </section>

  <!-- ========== 玩一玩 ========== -->
  <section id="scr-quiz" class="screen">
    <div class="topbar">
      <button class="btn small ghost" onclick="go('home')">← 退出</button>
      <div class="grow" id="quizTitle"></div>
      <div class="combo" id="quizCombo"></div>
    </div>
    <div class="qhead">
      <div class="progress"><i id="quizBar"></i></div>
      <div class="starbox" id="quizStars" style="padding:5px 12px;font-size:16px"><span class="s">⭐</span><b>0</b></div>
    </div>
    <div class="stage" id="quizStage"></div>
    <div class="options" id="quizOpts"></div>
  </section>

  <!-- ========== 结算 ========== -->
  <section id="scr-result" class="screen">
    <div class="result">
      <div class="medal" id="rsMedal">🏆</div>
      <div class="starrow" id="rsStars"></div>
      <div class="score" id="rsScore"></div>
      <div class="words" id="rsWords"></div>
      <div class="navrow" style="margin-top:10px">
        <button class="btn pink" onclick="startQuiz(state.groupId)">再玩一次</button>
        <button class="btn green" onclick="go('home')">回首页</button>
      </div>
    </div>
  </section>

</div>

<!-- ========== 休息 / 时长锁定 遮罩 ========== -->
<div class="blocker" id="blocker">
  <div class="bemo" id="bEmo">😴</div>
  <div class="btitle" id="bTitle">休息一下眼睛吧</div>
  <div class="bdesc" id="bDesc"></div>
  <div class="bcount" id="bCount">5:00</div>
  <div class="btask" id="bTask">
    <div class="btasklabel">🎯 亲子小任务</div>
    <div class="btaskbody"><span class="btaskemo" id="bTaskEmo">🍵</span><span id="bTaskText">给家人倒一杯水</span></div>
    <button class="btasknext" id="bTaskNext">换一个 ↻</button>
  </div>
  <button class="bparent" id="bParent">家长验证</button>
</div>

<!-- ========== 首次进入：解锁声音（必须在用户手势里） ========== -->
<div id="audioGate">
  <div class="gate">
    <div class="gem">🔊</div>
    <div class="gt">先点一下，打开声音</div>
    <div class="gd">手机的浏览器要求先点一次屏幕，<br>才能把字读出来哦～</div>
    <button class="btn pink gb" id="gateBtn">点我开始</button>
  </div>
</div>
<div id="audioTip"></div>

<script>
/* ================= 小工具 ================= */
const CN = ['零','一','二','三','四','五','六','七','八','九','十'];
const cn = n => (CN[n] !== undefined ? CN[n] : String(n));
const FRUIT = '🍎';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };

/* 声母 / 韵母 的"读音汉字"——让语音引擎读出正确发音（读字母会被念成英文） */
const SM_SAY = {b:'玻',p:'坡',m:'摸',f:'佛',d:'得',t:'特',n:'讷',l:'勒',g:'哥',k:'科',h:'喝',
  j:'基',q:'欺',x:'希',zh:'知',ch:'吃',sh:'诗',r:'日',z:'资',c:'次',s:'思',y:'衣',w:'乌'};
const YM_SAY = {a:'啊',o:'喔',e:'鹅',i:'衣',u:'乌','ü':'迂',ai:'哀',ei:'诶',ui:'威',ao:'熬',ou:'欧',
  iu:'优',ie:'耶','üe':'约',er:'儿',an:'安',en:'恩',in:'因',un:'温','ün':'晕',
  ang:'昂',eng:'鞥',ing:'英',ong:'轰'};

/* 零件 → 朗读汉字（直接读字母会被念成英文） */

let ac = null;
function actx(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ ac = null; } }
  if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone(freq, dur, type, vol, delay){
  const c = actx(); if(!c) return;
  const t = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.03);
}

/* ================= 朗读 ================= */
/* 手机端没有声音，基本是这四件事：①朗读必须在"用户点过屏幕"之后才被放行
   ②cancel() 是异步的，紧接着 speak() 会被吞掉 ③voice 指向了没下载的语音会静默失败
   ④微信/QQ 内置浏览器普遍屏蔽朗读。下面逐条绕开。 */

let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  let vs = [];
  try{ vs = speechSynthesis.getVoices() || []; }catch(e){ return; }
  if(!vs.length) return;                       // iOS 首帧常为空，等 onvoiceschanged 再来
  const zh = vs.filter(v => /^zh/i.test(v.lang || '') && v.localService !== false);
  voice = zh.find(v => /^zh[-_]?CN/i.test(v.lang))
       || zh.find(v => /Chinese|中文|普通话|Mandarin|Tingting|婷婷/i.test(v.name))
       || zh[0] || null;                       // 找不到就留空，只靠 lang 让引擎自己挑
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let audioReady = false;   // 是否已在用户手势里解锁过
let speakSeq  = 0;        // 每次朗读发一个号，让"被取消的上一句"的回调自动失效

const isInApp = /MicroMessenger|QQ\/|Weibo|AlipayClient|DingTalk|Workplace/i.test(navigator.userAgent);
const noTtsMsg   = () => '这个浏览器不支持语音朗读。' + (isInApp
  ? '请点右上角「···」→ <b>在浏览器中打开</b>'
  : '建议改用 <b>Safari</b> 或 <b>Chrome</b> 打开');
const ttsFailMsg = () => isInApp
  ? '读不出声音：微信/QQ 内置浏览器会屏蔽朗读，请点右上角「···」→ <b>在浏览器中打开</b>'
  : '读不出声音？请检查手机侧边的<b>静音开关</b>，或到系统设置里下载<b>中文语音包</b>';

let tipTimer = null;
function showAudioTip(html){
  const el = $('#audioTip'); if(!el) return;
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => el.classList.remove('show'), 9000);
}

/* 只能在用户手势的同步调用栈里执行：一次性放行 AudioContext 和语音合成。
   这里刻意不走 speak()，因为那个有 90ms 延后，一延后手势就失效了。 */
function unlockAudio(firstWords){
  actx();
  if(audioReady) return;
  audioReady = true;
  if(!('speechSynthesis' in window)){ showAudioTip(noTtsMsg()); return; }
  doSpeak(firstWords || ' ', false, speakSeq);   // 同步朗读：既解锁，又立刻出声
}

/* 主动停止（切页面、弹休息遮罩时用），同时作废待读的那一句 */
function stopSpeak(){
  speakSeq++;
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
}

function speak(text){
  if(!text) return;
  if(!('speechSynthesis' in window)){ showAudioTip(noTtsMsg()); return; }
  stopSpeak();
  const seq = speakSeq;
  setTimeout(() => { if(seq === speakSeq) doSpeak(text, false, seq); }, 90);
}

function doSpeak(text, noVoice, seq){
  if(seq !== speakSeq) return;
  let u;
  try{ u = new SpeechSynthesisUtterance(text); }catch(e){ showAudioTip(ttsFailMsg()); return; }
  u.lang = 'zh-CN'; u.rate = 0.72; u.pitch = 1.35; u.volume = 1;
  if(voice && !noVoice) u.voice = voice;

  let started = false, settled = false, wd = null;
  const giveUp = () => {                       // 带 voice 读不出来，就摘掉 voice 再试一次
    if(settled) return;                        // watchdog 和 onerror 可能同时到，只认第一次
    settled = true;
    clearTimeout(wd);
    if(seq !== speakSeq) return;
    if(!noVoice && voice) doSpeak(text, true, seq);
    else showAudioTip(ttsFailMsg());
  };
  u.onstart = () => { started = settled = true; clearTimeout(wd); };
  u.onerror = e => {
    if(started || settled || seq !== speakSeq) return;
    if(/cancel|interrupt/i.test((e && e.error) || '')) return;
    giveUp();
  };
  wd = setTimeout(() => {                      // 引擎既不发声也不报错（安卓上很常见）
    if(started || seq !== speakSeq) return;
    try{ speechSynthesis.cancel(); }catch(e){}
    giveUp();
  }, 1100);

  try{ speechSynthesis.speak(u); }catch(e){ clearTimeout(wd); giveUp(); }
}
function sayItem(it){ speak(it.sp || ((it.say || it.z) + '，' + it.word)); }

function numOpts(ans){
  const a = +ans, set = new Set([a]);
  let guard = 0;
  while(set.size < 3 && guard++ < 100){
    const d = a + (rnd(2) ? 1 : -1) * (1 + rnd(3));
    if(d < 0 || d > 12 || set.has(d)) continue;
    set.add(d);
  }
  let k = 0;
  while(set.size < 3){ set.add(k++); }
  return shuffle([...set]);
}
function makeMathQ(){
  const types = ['count','count','add','sub','cmp'];
  const t = types[rnd(types.length)];

  if(t === 'count'){

    return {

      ans: String(a+b), opts: numOpts(a+b)
    };
  }
  if(t === 'sub'){
    const a = 3 + rnd(8);
    const b = 1 + rnd(a);
    return {
      visual: FRUIT.repeat(a-b) + '<span class="off">' + FRUIT.repeat(b) + '</span>',
      expr: a + ' <span class="q">－</span> ' + b + ' = ?',
      speakText: cn(a) + ' 减 ' + cn(b) + ' 等于几，划掉 ' + cn(b) + ' 个还剩几个',
      ans: String(a-b), opts: numOpts(a-b)
    };
  }
  const set = new Set();
  while(set.size < 3) set.add(1 + rnd(10));
  const nums = [...set];
  const askMax = rnd(2) === 0;
  const ans = askMax ? Math.max(...nums) : Math.min(...nums);
  return {
    visual: nums.join('　　'),
    expr: '哪个数最' + (askMax ? '大' : '小') + '？',
    speakText: '下面三个数，哪个数最' + (askMax ? '大' : '小'),
    ans: String(ans), opts: nums.slice()
  };
}

/* ================= 拼读出题 ================= */
/* mode: mix=拼一拼  sm=找声母  ym=找韵母 */
function distractBlend(ans, pool, mode){
  const keyOf = x => (mode === 'mix' ? x.l : mode === 'sm' ? x.sm : x.ym);
  const used = new Set([keyOf(ans)]);
  const out = [];
  const grab = arr => {
    for(const x of shuffle(arr)){
      if(out.length >= 2) break;
      const k = keyOf(x);
      if(used.has(k)) continue;
      used.add(k); out.push(x);
    }
  };
  if(mode === 'mix'){
    grab(pool.filter(x => x.sm === ans.sm));   // 换韵母，如 ba → bo
    grab(pool.filter(x => x.ym === ans.ym));   // 换声母，如 ba → pa
  }else if(mode === 'sm'){
    grab(pool.filter(x => x.ym === ans.ym));   // 同韵母、换声母
  }else{
    grab(pool.filter(x => x.sm === ans.sm));   // 同声母、换韵母
  }
  grab(pool);                                   // 兜底
  return out;
}
function buildBlendQ(pool){
  const types = ['mix','mix','sm','ym'];
  const t = types[rnd(types.length)];
  const ans = pool[rnd(pool.length)];
  const others = distractBlend(ans, pool, t);
  const labelOf = x => (t === 'mix' ? x.l : t === 'sm' ? x.sm : x.ym);
  const answerAudio = ans.c + '，' + ans.word + '的' + ans.c;
  const parts = partsOf(ans);                  // 两拼 2 段，三拼 3 段
  const sayAll = parts.map(SAY).join('，');

  let expr, tipText, startAudio, cls;
  if(t === 'mix'){
    expr = parts.join(' ＋ ') + ' ＝ <span class="q">?</span>';
    tipText = '拼一拼，是哪个音节？';
    startAudio = sayAll + '，拼一拼是什么';
    cls = 'syl';
  }else if(t === 'sm'){
    expr = '<span class="q">?</span> ＋ ' + parts.slice(1).join(' ＋ ') + ' ＝ ' + ans.l;
    tipText = '开头是哪个声母？';
    startAudio = '这个音节是 ' + ans.c + '，' + ans.word + '的' + ans.c + '，开头是哪个声母';
    cls = 'sm';
  }else{
    expr = parts.slice(0, -1).join(' ＋ ') + ' ＋ <span class="q">?</span> ＝ ' + ans.l;
    tipText = '后面是哪个韵母？';
    startAudio = '这个音节是 ' + ans.c + '，' + ans.word + '的' + ans.c + '，后面是哪个韵母';
    cls = 'sm';
  }

  return {
    kind:'blend',
    stage:{ type:'card', visual:'', expr, exprCls:'fml' },
    tipText, startAudio, answerAudio,
    ansKey: labelOf(ans),
    opts: shuffle([ans, ...others]).map(x => ({ key:labelOf(x), label:labelOf(x), cls }))
  };
}

/* ================= 声调出题 ================= */
/* 播放例字读音（TTS 读汉字，声调是对的），从 3 个带调号拼音里选出听到的那个 */
function buildToneQ(groups){
  const grp = groups[rnd(groups.length)];
  const ans = grp.items[rnd(grp.items.length)];
  const others = shuffle(grp.items.filter(x => x.l !== ans.l)).slice(0, 2);
  const audio = ans.c + '，' + ans.word;
  return {
    kind:'tone',
    stage:{ type:'speaker' },
    tipText:'听一听，选出你听到的',
    startAudio: audio, answerAudio: audio,
    ansKey: ans.l,
    opts: shuffle([ans, ...others]).map(x => ({
      key:x.l, label:x.l, cls: x.l.length >= 5 ? 'tone long' : 'tone'
    }))
  };
}

    tipText:'听一听，这是哪个拼音？',
    startAudio: audio, answerAudio: audio,
    ansKey: ans.l,
    opts: shuffle([ans, ...others]).map(x => ({ key:x.l, label:x.l, cls:'' }))
  };
}
function buildMathQ(){
  const q = makeMathQ();
  return {
    kind:'math',
    stage:{ type:'card', visual:q.visual, expr:q.expr },
    tipText:'想一想，选一选',
    startAudio: q.speakText, answerAudio: q.speakText,
    ansKey: q.ans,
    opts: shuffle(q.opts).map(n => ({ key:String(n), label:String(n), cls:'' }))
  };
}
function buildZiQ(pool){
  const picPool = pool.filter(x => x.p);
  const types = ['sound','sound','pic','pic','rev'];
  const t = types[rnd(types.length)];

  if(t === 'sound'){
    const ans = pool[rnd(pool.length)];
    let cand = pool.filter(x => x.z !== ans.z && x.py[0] === ans.py[0]);
    if(cand.length < 2) cand = pool.filter(x => x.z !== ans.z);
    const others = shuffle(cand).slice(0, 2);
    const audio = ans.z + '，' + ans.word;
    return {
      kind:'zi',
      stage:{ type:'speaker' },
      tipText:'听一听，这是哪个字？',
      startAudio: audio, answerAudio: audio,
      ansKey: ans.z,
      opts: shuffle([ans, ...others]).map(x => ({ key:x.z, label:x.z, cls:'' }))
    };
  }
  if(t === 'pic'){
    const ans = picPool[rnd(picPool.length)];
    const others = shuffle(picPool.filter(x => x.z !== ans.z)).slice(0, 2);
    return {
      kind:'zi',
      stage:{ type:'card', visual:'<span class="bigemo">'+ans.e+'</span>', expr:'' },
      tipText:'看图片，选一选，是哪个字？',
      startAudio:'看图片，选一选，是哪个字',
      answerAudio: ans.z + '，' + ans.word,
      ansKey: ans.z,
      opts: shuffle([ans, ...others]).map(x => ({ key:x.z, label:x.z, cls:'' }))
    };
  }
  const ans = picPool[rnd(picPool.length)];
  const others = shuffle(picPool.filter(x => x.z !== ans.z)).slice(0, 2);
  return {
    kind:'zi',
    stage:{ type:'card', visual:'<span class="bigzi">'+ans.z+'</span>',
            expr:'<span class="qpy">'+ans.py+'</span>' },
    tipText:'这个字是什么意思？',
    startAudio:'这个字是什么意思',
    answerAudio: ans.z + '，' + ans.word,
    ansKey: ans.e,
    opts: shuffle([ans, ...others]).map(x => ({ key:x.e, label:x.e, cls:'pic' }))
  };
}

/* ================= 屏幕切换 ================= */
function go(name){
  $$('.screen').forEach(s => s.classList.remove('active'));
  $('#scr-'+name).classList.add('active');
  if(name !== 'quiz') stopSpeak();
}
function saveStars(){ localStorage.setItem('py_stars', state.stars); }

function bumpStars(n){

/* ================= 学一学 ================= */
/* 每个模块上次看到第几张卡片，存在本地（换浏览器/换设备不同步） */
const PROGRESS_KEY = 'py_progress';
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}') || {}; }catch(e){ progress = {}; }
function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }catch(e){}
}
/* 越界或脏数据一律退回第 1 张，避免模块内容增减后定位到不存在的卡片 */
function lastIdx(id, len){
  const v = progress[id];
  return (Number.isInteger(v) && v >= 0 && v < len) ? v : 0;
}

function startLearn(id){
  state.groupId = id;
  state.group = GROUPS.find(g => g.id === id);
  state.learnIdx = lastIdx(id, state.group.items.length);
  go('learn'); renderLearn();
}
function renderLearn(){
  const g = state.group, it = g.items[state.learnIdx];
  const card = $('#letterCard');
  $('#learnTitle').textContent = g.emoji + ' ' + g.name;
  $('#scr-learn').style.setProperty('--accent', g.accent);
  $('#scr-learn').style.setProperty('--soft', g.soft);
  card.classList.toggle('formula', g.kind === 'blend');

  $('#lcBig').textContent = it.l || it.z;
  $('#lcPy').textContent = (g.kind === 'blend') ? partsOf(it).join(' ＋ ') : (it.py || it.tn || '');
  if(g.kind === 'math'){
    $('#lcEmo').className = 'emo many';
    $('#lcEmo').innerHTML = it.e.repeat(it.n);
  }else{
    $('#lcEmo').className = 'emo';
    $('#lcEmo').textContent = it.e;
  }
  $('#lcWord').textContent = it.word;
  $('#lcCount').textContent = (state.learnIdx+1) + ' / ' + g.items.length;
  sayItem(it);
}
function learnStep(d){
  const n = state.group.items.length;
  state.learnIdx = (state.learnIdx + d + n) % n;
  progress[state.groupId] = state.learnIdx; saveProgress();
  const card = $('#letterCard');
  card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
  renderLearn();
}

/* ================= 错题本 ================= */
/* 答错的题整道存下来（题目对象本身就是纯数据），下次闯关优先复习，答对即移出 */
const WRONG_KEY = 'py_wrong';
const WRONG_MAX = 20;        // 每个模块最多留 20 道，超了丢最旧的
const WRONG_IN_QUIZ = 4;     // 每次闯关最多安排 4 道复习题
let wrongBook = {};
try{ wrongBook = JSON.parse(localStorage.getItem(WRONG_KEY) || '{}') || {}; }catch(e){ wrongBook = {}; }
function saveWrong(){
  try{ localStorage.setItem(WRONG_KEY, JSON.stringify(wrongBook)); }catch(e){}
}
function wrongList(id){
  const a = wrongBook[id];
  return Array.isArray(a) ? a : [];
}
/* 同一个知识点只留一条，否则同一个字母答错两次会在一轮里出现两遍 */
function wrongKeyOf(q){
  return [q.kind, q.ansKey, q.stage.expr || '', q.stage.visual || ''].join('|');
}
function addWrong(id, q){
  const list = wrongList(id).filter(x => wrongKeyOf(x) !== wrongKeyOf(q));
  list.push(q);
  while(list.length > WRONG_MAX) list.shift();
  wrongBook[id] = list; saveWrong();
}
function removeWrong(id, q){
  const list = wrongList(id);
  const next = list.filter(x => wrongKeyOf(x) !== wrongKeyOf(q));
  if(next.length !== list.length){ wrongBook[id] = next; saveWrong(); }
}

/* ================= 玩一玩 ================= */
const QUIZ_LEN = 10;
function startQuiz(id){
  if(!id) return;
  state.groupId = id;
  state.group = GROUPS.find(g => g.id === id);
  const g = state.group;
  let list;
  if(g.kind === 'math'){
    list = Array.from({length:QUIZ_LEN}, () => buildMathQ());
  }else if(g.kind === 'blend'){
    list = Array.from({length:QUIZ_LEN}, () => buildBlendQ(g.items));
  }else if(g.kind === 'tone'){
    list = Array.from({length:QUIZ_LEN}, () => buildToneQ(TONE_GROUPS));
  }else if(g.kind === 'zi'){
    list = Array.from({length:QUIZ_LEN}, () => buildZiQ(g.items));
  }else{
    list = shuffle(g.items).slice(0, QUIZ_LEN).map(ans => buildPinyinQ(ans, g.items));
  }
  /* 用错题替换掉最前面几道新题，总量仍是 10 道；选项重新打乱，免得孩子记住按钮位置 */
  const review = shuffle(wrongList(id)).slice(0, WRONG_IN_QUIZ)
    .map(q => Object.assign({}, q, { opts: shuffle(q.opts) }));
  if(review.length) list = shuffle(review.concat(list.slice(review.length)));
  state.quiz = { list, idx:0, right:0, combo:0, best:0, earned:0, locked:false };
  $('#quizTitle').textContent = g.emoji + ' ' + g.name;
  go('quiz'); renderQuiz();
}
function renderQuiz(){
  const q = state.quiz, cur = q.list[q.idx];
  $('#quizBar').style.width = (q.idx / QUIZ_LEN * 100) + '%';
  $('#quizStars').innerHTML = '<span class="s">⭐</span><b>'+q.earned+'</b>';
  $('#quizCombo').textContent = q.combo >= 2 ? ('🔥 连对 ' + q.combo) : '';

  const stage = $('#quizStage');
  if(cur.stage.type === 'speaker'){
    stage.innerHTML =
      '<button class="speaker" id="speaker">🔊</button>' +
      '<div class="tip">题目 '+(q.idx+1)+' / '+QUIZ_LEN+'　'+cur.tipText+'</div>';
    const sp = stage.querySelector('#speaker');
    sp.onclick = replay;
    sp.classList.add('ring');
    setTimeout(() => sp.classList.remove('ring'), 1500);
  }else{
    stage.innerHTML =
      '<div class="qcard" id="qCard">' +
        (cur.stage.visual ? '<div class="qvisual">'+cur.stage.visual+'</div>' : '') +
        (cur.stage.expr   ? '<div class="qexpr'+(cur.stage.exprCls ? ' '+cur.stage.exprCls : '')+'">'+cur.stage.expr+'</div>' : '') +
        '<div class="qaudio">🔊 点一下读一遍</div>' +
      '</div>' +
      '<div class="tip">题目 '+(q.idx+1)+' / '+QUIZ_LEN+'　'+cur.tipText+'</div>';
    stage.querySelector('#qCard').onclick = replay;
  }

  const box = $('#quizOpts'); box.innerHTML = '';
  cur.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt' + (o.cls ? ' ' + o.cls : '');
    b.textContent = o.label;
    b.dataset.key = o.key;
    b.onclick = () => pick(o, b);
    box.appendChild(b);
  });

  q.locked = false;
  setTimeout(() => speak(cur.startAudio), 300);
}
function replay(){
  const cur = state.quiz.list[state.quiz.idx];
  SFX.tap();
  const el = cur.stage.type === 'speaker' ? $('#speaker') : $('#qCard');
  if(el){ el.classList.remove('ring'); void el.offsetWidth; el.classList.add('ring');
    setTimeout(() => el.classList.remove('ring'), 800); }
  speak(cur.startAudio);
}
function pick(o, btn){
  const q = state.quiz; if(q.locked) return; q.locked = true;
  const cur = q.list[q.idx];
  if(o.key === cur.ansKey){
    btn.classList.add('right');
    q.right++; q.combo++; q.best = Math.max(q.best, q.combo); q.earned += 1;
    SFX.right(); flyStar(btn);
    $('#quizStars').innerHTML = '<span class="s">⭐</span><b>'+q.earned+'</b>';
    const pulse = $('#quizStars'); pulse.classList.remove('pop'); void pulse.offsetWidth; pulse.classList.add('pop');
    if(q.combo >= 3){ const c = $('#quizCombo'); c.classList.remove('show'); void c.offsetWidth; c.classList.add('show'); }
    bumpStars(1);
    removeWrong(state.groupId, cur);
    setTimeout(nextQ, 900);
  }else{
    btn.classList.add('wrong');
    SFX.wrong(); q.combo = 0;
    addWrong(state.groupId, cur);
    $('#quizCombo').textContent = '';
    const rightOpt = $$('#quizOpts .opt').find(b => b.dataset.key === cur.ansKey);
    if(rightOpt) rightOpt.classList.add('right');
    const tip = $('#quizStage').querySelector('.tip');
    if(tip) tip.textContent = '没关系～正确答案是 ' + cur.ansKey;
    speak(cur.answerAudio);
    setTimeout(nextQ, 2200);
  }
}
function nextQ(){ const q = state.quiz; q.idx++; q.idx >= QUIZ_LEN ? finishQuiz() : renderQuiz(); }

function finishQuiz(){
  const q = state.quiz;
  const rate = q.right / QUIZ_LEN;
  const stars = rate >= 0.9 ? 3 : rate >= 0.6 ? 2 : rate >= 0.3 ? 1 : 0;
  $('#quizBar').style.width = '100%';
  const row = $('#rsStars'); row.innerHTML = '';
  for(let i=0;i<3;i++){ const s = document.createElement('span'); s.textContent = '⭐'; row.appendChild(s); }
  [...row.children].forEach((s,i) => setTimeout(() => { s.classList.add('on'); tone(700+i*220,0.2,'sine',0.1); }, 260+i*260));
  $('#rsMedal').textContent = stars===3 ? '🏆' : stars===2 ? '🥈' : stars===1 ? '🥉' : '🌱';
  $('#rsScore').textContent = '答对 ' + q.right + ' / ' + QUIZ_LEN + ' 题　最高连对 ' + q.best;
  $('#rsWords').textContent = stars===3 ? '太厉害啦！你是小达人！'
    : stars===2 ? '很不错哦，再来一次会更好！'
    : stars===1 ? '有进步，我们继续加油！'
    : '慢慢来，多听几遍就会啦～';
  go('result');
  SFX.win();
  if(stars >= 2) confetti(stars === 3 ? 36 : 18);
}
function flyStar(fromEl){
  const r = fromEl.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'fly'; s.textContent = '⭐';
  s.style.left = (r.left + r.width/2) + 'px';
  s.style.top  = (r.top + r.height/2) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1050);
}
function confetti(n){
  const emo = ['🎉','⭐','🎊','💛','🌈','✨'];
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = emo[rnd(emo.length)];
    c.style.left = rnd(96) + 'vw';
    c.style.animationDuration = (1.7 + Math.random()*1.5) + 's';
    c.style.animationDelay = (Math.random()*0.6) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

/* ================= 使用时长限制（护眼） ================= */
const LIMIT = {
  session: 10 * 60,      // 连续使用 10 分钟
  rest:     5 * 60,      // 强制休息 5 分钟
  daily:   30 * 60,      // 每天最多 30 分钟
  bonusStep:10 * 60      // 家长验证后追加 10 分钟
};
const usage = { date:'', usedToday:0, sessionSec:0, restUntil:0, bonus:0 };

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function loadUsage(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem('py_usage') || 'null'); }catch(e){}
  const today = todayKey();
  if(raw && raw.date === today){
    usage.date = raw.date;
    usage.usedToday  = raw.usedToday  || 0;
    usage.sessionSec = raw.sessionSec || 0;
    usage.restUntil  = raw.restUntil  || 0;
    usage.bonus      = raw.bonus      || 0;
  }else{
    usage.date = today;
    usage.usedToday = 0; usage.sessionSec = 0; usage.restUntil = 0; usage.bonus = 0;
  }
  if(usage.restUntil && usage.restUntil <= Date.now()){ usage.restUntil = 0; usage.sessionSec = 0; }
  saveUsage(true);
}
let saveTick = 0;
function saveUsage(force){
  if(!force && (++saveTick % 5)) return;
  try{ localStorage.setItem('py_usage', JSON.stringify(usage)); }catch(e){}
}
function dailyLimit(){ return LIMIT.daily + usage.bonus; }
function fmtClock(sec){
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec/60) + ':' + String(sec % 60).padStart(2, '0');
}

function updateMeter(){
  const el = $('#timeChip'); if(!el) return;
  const left = Math.max(0, dailyLimit() - usage.usedToday);
  el.textContent = '⏳ ' + (left >= 60 ? Math.ceil(left/60) + ' 分' : left + ' 秒');
  el.classList.toggle('warn', left <= 300);
}

function showBlocker(kind, secLeft){
  const b = $('#blocker');
  const entering = !b.classList.contains('show');
  if(kind === 'rest'){
    $('#bEmo').textContent = '😴';
    $('#bTitle').textContent = '休息一下眼睛吧';
    $('#bDesc').textContent = '已经玩了 10 分钟啦，眼睛歇一歇，和家人做个小任务吧。';
    $('#bCount').textContent = fmtClock(secLeft || 0);
    $('#bCount').style.display = '';
    $('#bTask').style.display = '';
  }else{
    $('#bEmo').textContent = '🌙';
    $('#bTitle').textContent = '今天玩够啦';
    $('#bDesc').textContent = '今天已经用了 30 分钟。眼睛要休息，我们明天再玩吧！';
    $('#bCount').textContent = '明天见 👋';
    $('#bCount').style.display = '';
    $('#bTask').style.display = 'none';
  }
  if(entering){
    b.classList.add('show');
    stopSpeak();
    if(kind === 'rest') nextRestTask();      // 只在进入休息那一刻抽任务，否则每秒都会换
  }
}
function hideBlocker(){ $('#blocker').classList.remove('show'); }

function updateBlocker(){
  const now = Date.now();
  if(usage.restUntil > now){
    showBlocker('rest', (usage.restUntil - now) / 1000);
    return;
  }
  if(usage.restUntil){ usage.restUntil = 0; saveUsage(true); }   // 休息自然结束（sessionSec 已在进入休息时清零）
  if(usage.usedToday >= dailyLimit()) showBlocker('lock');
  else hideBlocker();
}

function tick(){
  if(document.hidden) return;                      // 后台 / 锁屏不计时
  if(usage.date !== todayKey()) loadUsage();       // 跨天自动重置
  const now = Date.now();
  const resting = usage.restUntil > now;
  const locked  = usage.usedToday >= dailyLimit();
  if(!resting && !locked){
    usage.usedToday++;
    usage.sessionSec++;
    if(usage.sessionSec >= LIMIT.session){
      usage.sessionSec = 0;                        // 本段重新计数
      usage.restUntil = now + LIMIT.rest * 1000;   // 强制休息
    }
    saveUsage();
  }
  updateBlocker();
  updateMeter();
}

/* 家长侧看一眼错题本，顺手可清空（孩子不识字，所以只放在家长验证后面） */
function reviewWrongBook(){
  const rows = GROUPS
    .map(g => ({ id: g.id, name: g.name, n: wrongList(g.id).length }))
    .filter(r => r.n > 0);
  if(!rows.length) return;                                  // 空的就不多弹一个框
  const total = rows.reduce((s, r) => s + r.n, 0);
  const detail = rows.map(r => r.name + ' ' + r.n + ' 道').join('、');
  const msg = '错题本：共 ' + total + ' 道\n' + detail +
              '\n\n点「确定」清空；点「取消」保留，下次闯关仍会优先复习。';
  if(!window.confirm(msg)) return;
  rows.forEach(r => { delete wrongBook[r.id]; });
  saveWrong();
}

/* 家长出口：一道乘法题，孩子做不出，家长一秒过 */
function parentGate(){
  const a = 6 + rnd(4), c = 6 + rnd(4);
  const v = window.prompt('家长验证：' + a + ' × ' + c + ' = ?');
  if(v === null) return;
  if(+v !== a * c){ window.alert('答案不对哦～'); return; }
  if(usage.restUntil > Date.now()){
    usage.restUntil = 0; usage.sessionSec = 0;     // 跳过本次休息
    window.alert('已通过验证，可以继续玩了');
  }else{
    usage.bonus += LIMIT.bonusStep;                // 今天再给 10 分钟
    window.alert('已通过验证，今天再加 10 分钟');
  }
  saveUsage(true);
  updateBlocker();
  updateMeter();
  reviewWrongBook();
}

/* ================= 启动 ================= */
$('#letterCard').addEventListener('click', () => {
  SFX.tap(); sayItem(state.group.items[state.learnIdx]);
});
$('#bParent').addEventListener('click', parentGate);
$('#bTaskNext').addEventListener('click', () => { SFX.tap(); nextRestTask(); });
document.addEventListener('click', () => { actx(); }, {once:true});
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  tick();
  if('speechSynthesis' in window){ try{ speechSynthesis.resume(); }catch(e){} }
});

/* 首次进入先解锁声音：这一步必须发生在用户手势里，晚一步手机就不给读了 */
const gateEl = $('#audioGate');
if('speechSynthesis' in window) gateEl.classList.add('show');
else showAudioTip(noTtsMsg());

$('#gateBtn').addEventListener('click', () => {
  unlockAudio('你好呀，我们一起学拼音吧');   // 同步执行，不能包进 setTimeout，否则手势就失效了
  gateEl.classList.remove('show');
  SFX.tap();
});

renderHome();
loadUsage();
updateMeter();
updateBlocker();
setInterval(tick, 1000);

/* 离线打开：注册 Service Worker。file:// 直接双击打开时浏览器不允许，跳过即可 */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
